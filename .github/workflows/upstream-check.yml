name: Upstream check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # The vendored tailwind.css comes from the pinned shadcn package, so the
      # package and the snapshot are updated together here (Dependabot ignores it).
      - name: Update the pinned shadcn package
        run: bun add --dev --exact shadcn@latest

      # Icons are inlined from the pinned lucide package; the visual tests
      # compare against the lucide-react build of the same version.
      - name: Update the pinned lucide packages
        run: |
          version="$(npm view lucide version)"
          bun add --dev --exact "lucide@$version"
          (cd tests/visual && bun add --exact "lucide-react@$version")

      - name: Sync upstream snapshot
        id: sync
        run: bun run upstream:sync --report "$RUNNER_TEMP/report.md"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Regenerate
        id: generate
        continue-on-error: true
        run: bun run generate

      - name: Verify
        id: verify
        continue-on-error: true
        run: bun run verify

      # A change in upstream licensing blocks generation (docs/adr/0013) and
      # needs a human decision, so it gets its own label instead of needs-adapter.
      - name: Summarize
        id: summary
        env:
          GENERATE: ${{ steps.generate.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          LICENSE_REVIEW: ${{ steps.sync.outputs.license_review }}
        run: |
          labels="upstream"
          draft="false"
          if [ "$LICENSE_REVIEW" = "true" ]; then
            labels="$labels,license-review"
            draft="true"
          fi
          if [ "$GENERATE" != "success" ] || [ "$VERIFY" != "success" ]; then
            draft="true"
            if [ "$LICENSE_REVIEW" != "true" ]; then
              labels="$labels,needs-adapter"
            fi
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "### Checks"
            echo
            echo "- \`bun run generate\`: $GENERATE"
            echo "- \`bun run verify\`: $VERIFY"
            if [ "$LICENSE_REVIEW" = "true" ]; then
              echo
              echo "Generation is blocked by the upstream license check; see the caution at the top."
            elif [ "$GENERATE" != "success" ] || [ "$VERIFY" != "success" ]; then
              echo
              echo "Generation or verification failed. Add or update a transformer, adapter, or config rule before merging; see the workflow logs."
            fi
          } >> "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Opens or updates a PR; never merges. The repository must allow GitHub
      # Actions to create pull requests (Settings > Actions > General).
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: upstream/base-nova
          delete-branch: true
          commit-message: "chore(upstream): sync shadcn/ui base-nova"
          title: "chore(upstream): sync shadcn/ui base-nova"
          body-path: ${{ runner.temp }}/report.md
          labels: ${{ steps.summary.outputs.labels }}
          draft: ${{ steps.summary.outputs.draft == 'true' }}

      # pull_request runs for PRs opened with GITHUB_TOKEN wait for manual
      # approval, but workflow_dispatch always runs, so start CI on the PR branch
      # directly. Its check runs attach to the PR's head commit.
      - name: Run CI on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref upstream/base-nova
