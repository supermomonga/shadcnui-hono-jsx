name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by upstream-check for its PR branch: PRs opened with
  # GITHUB_TOKEN otherwise wait for manual approval before CI runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run dev:install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Generated files are up to date
        run: |
          bun run generate
          git diff --exit-code
          test -z "$(git status --porcelain)"

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run dev:install
      - run: bun run examples:build
      - run: bun run examples:typecheck
      - run: bun run examples:test

  # Installs with the CLI into a clean Hono project (tests/install). The job
  # keeps its old name because branch protection requires it.
  registry-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:install

  # Screenshots generated components against upstream shadcn/ui (React) with the
  # same theme. React lives only in tests/visual, never in generated output.
  visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/visual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run dev:install
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run typecheck
      - run: bun run test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-parity-report
          path: tests/visual/playwright-report

  # The same comparisons in the other Base UI styles and in Nova's menu color
  # and RTL variants (docs/adr/0030): the repository root is installed with
  # the default preset in each. Menu colors only change classes, so they skip
  # the behavior tests.
  visual-styles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: base-vega, install: --style base-vega }
          - { name: base-maia, install: --style base-maia }
          - { name: base-lyra, install: --style base-lyra }
          - { name: base-mira, install: --style base-mira }
          - { name: base-luma, install: --style base-luma }
          - { name: base-sera, install: --style base-sera }
          - { name: base-rhea, install: --style base-rhea }
          - { name: rtl, install: --rtl }
          - { name: menu-inverted, install: --menu-color inverted, playwright: --grep-invert behave }
          - { name: menu-default-translucent, install: --menu-color default-translucent, playwright: --grep-invert behave }
          - { name: menu-inverted-translucent, install: --menu-color inverted-translucent, playwright: --grep-invert behave }
          - { name: icons-tabler, install: --icon-library tabler, playwright: --grep-invert behave }
          - { name: icons-hugeicons, install: --icon-library hugeicons, playwright: --grep-invert behave }
          - { name: icons-phosphor, install: --icon-library phosphor, playwright: --grep-invert behave }
          - { name: icons-remixicon, install: --icon-library remixicon, playwright: --grep-invert behave }
    name: visual-styles (${{ matrix.name }})
    defaults:
      run:
        working-directory: tests/visual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run dev:install ${{ matrix.install }}
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun render.ts && bunx playwright test ${{ matrix.playwright }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-parity-report-${{ matrix.name }}
          path: tests/visual/playwright-report
